services:
  - type: web
    name: hawkview-api-dev
    runtime: docker
    plan: free
    region: ohio
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health/database
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '8080'
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: HAWKVIEW_AUTH_REDIRECT_URL
        sync: false
      - key: SECRET_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FRONTEND_APP_URL
        sync: false
      - key: GAS_PREVIEW_PROJECT_NUMBER
        sync: false
      - key: MICROSOFT_ADMIN_CONSENT_REDIRECT_URI
        sync: false
      - key: MICROSOFT_REQUIRED_PERMISSIONS
        sync: false
      - key: SCHEDULER_SHARED_SECRET
        sync: false
      - key: SCHEDULED_SYNC_BATCH_SIZE
        value: '10'
      - key: MAXMIND_LICENSE_KEY
        sync: false
      - key: GEOIP_CITY_DATABASE_PATH
        value: '/tmp/GeoLite2-City.mmdb'

  - type: cron
    name: hawkview-sync-dev
    runtime: docker
    plan: starter
    region: ohio
    schedule: '*/5 * * * *'
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: node scripts/trigger-scheduled-sync.mjs
    envVars:
      - key: SCHEDULER_SHARED_SECRET
        sync: false
