services:
  - type: web
    name: hawkview-api-dev
    runtime: docker
    plan: free
    domains:
      - api.hawkviewapp.com
    # Keep the legacy Render hostname reachable until the frontend, scheduler,
    # Microsoft callback, smoke check, and authenticated canary all pass through
    # the branded domain. Disable it in a later verified cutover.
    renderSubdomainPolicy: enabled
    region: ohio
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health/database
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '8080'
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: HAWKVIEW_AUTH_REDIRECT_URL
        sync: false
      - key: SECRET_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FRONTEND_APP_URL
        sync: false
      - key: GAS_PREVIEW_PROJECT_NUMBER
        sync: false
      - key: MICROSOFT_ADMIN_CONSENT_REDIRECT_URI
        sync: false
      - key: MICROSOFT_REQUIRED_PERMISSIONS
        sync: false
      - key: SCHEDULER_SHARED_SECRET
        sync: false
      - key: SCHEDULED_SYNC_BATCH_SIZE
        value: '10'
      # The five-minute cron remains the recovery heartbeat. The audit feed
      # polls every 15 minutes when caught up, but drains an existing backlog
      # on each cron run. These ceilings bound Render bandwidth and memory.
      - key: M365_AUDIT_POLL_INTERVAL_MINUTES
        value: '15'
      - key: M365_AUDIT_MAX_BLOBS_PER_RUN
        value: '12'
      - key: M365_AUDIT_MAX_DOWNLOAD_MB_PER_RUN
        value: '12'
      - key: M365_AUDIT_MAX_RUNTIME_SECONDS
        value: '45'
      - key: M365_AUDIT_TENANT_DAILY_DOWNLOAD_MB
        value: '50'
      - key: M365_AUDIT_DEPLOYMENT_DAILY_DOWNLOAD_MB
        value: '100'
      - key: M365_AUDIT_TENANT_MONTHLY_DOWNLOAD_MB
        value: '1000'
      - key: M365_AUDIT_DEPLOYMENT_MONTHLY_DOWNLOAD_MB
        value: '2000'
      - key: M365_AUDIT_TENANT_DAILY_RECORDS
        value: '1000'
      - key: M365_AUDIT_DEPLOYMENT_DAILY_RECORDS
        value: '2000'
      - key: M365_AUDIT_TENANT_MONTHLY_RECORDS
        value: '20000'
      - key: M365_AUDIT_DEPLOYMENT_MONTHLY_RECORDS
        value: '40000'
      - key: MAXMIND_LICENSE_KEY
        sync: false
      - key: GEOIP_CITY_DATABASE_PATH
        value: '/tmp/GeoLite2-City.mmdb'

  - type: cron
    name: hawkview-sync-dev
    runtime: docker
    plan: starter
    region: ohio
    schedule: '*/5 * * * *'
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: node scripts/trigger-scheduled-sync.mjs
    envVars:
      - key: SCHEDULER_SHARED_SECRET
        sync: false
