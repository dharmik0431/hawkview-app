services:
  - type: web
    name: hawkview-api-dev
    runtime: docker
    plan: free
    region: ohio
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SECRET_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FRONTEND_APP_URL
        sync: false
      - key: GAS_PREVIEW_PROJECT_NUMBER
        sync: false
      - key: MICROSOFT_ADMIN_CONSENT_REDIRECT_URI
        sync: false
      - key: MICROSOFT_REQUIRED_PERMISSIONS
        sync: false
      - key: SCHEDULER_SHARED_SECRET
        sync: false
      - key: SCHEDULED_SYNC_BATCH_SIZE
        value: "10"
