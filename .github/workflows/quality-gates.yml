name: Required quality gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      migration_profile:
        description: >-
          Database provisioning for the backend job. 'fresh' is today's path:
          apply every committed migration to an empty disposable database.
          'haw70-upgrade' instead runs the HAW-70 staged baseline-to-candidate
          upgrade driver and SKIPS the fresh migration and the database
          application suite, because that driver requires an empty target and
          deliberately retains authority tombstones after its scoped cleanup.
          The two are mutually exclusive and remain separate proofs.
        required: false
        default: fresh
        type: choice
        options:
          - fresh
          - haw70-upgrade

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_validation_only_0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release PR number for frontend changes
        if: github.event_name == 'pull_request'
        env:
          HAWKVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HAWKVIEW_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/frontend-release-pr-check.mjs
      - run: npm ci
      - name: Frontend release gate contract tests
        run: node --test .github/scripts/frontend-release-pr-check.test.mjs
      - name: Frontend tests
        shell: bash
        run: |
          mapfile -t tests < <(find lib -type f -name '*.test.ts' -print | sort)
          test "${#tests[@]}" -gt 0
          node --experimental-strip-types --test "${tests[@]}"
      - name: Release canary contract tests
        run: node --test .github/scripts/authenticated-msp-canary.test.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  backend-quality:
    name: Backend quality and database integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://hawkview_ci:hawkview_ci@127.0.0.1:5432/hawkview_ci
      HAWKVIEW_RUN_DATABASE_INTEGRATION_TESTS: '1'
      # This hosted backend job provisions the exact disposable loopback service.
      HAWKVIEW_CI_DISPOSABLE_POSTGRES: '1'
      HAWKVIEW_HAW70_TENANT_DELETE_WITNESS: '1'
      HAWKVIEW_HAW70_AUDIT_WRITER_WITNESS: '1'
      HAWKVIEW_HAW70_DELETE_LOCK_ORDER_WITNESS: '1'
      TZ: UTC
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hawkview_ci
          POSTGRES_PASSWORD: hawkview_ci
          POSTGRES_DB: hawkview_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hawkview_ci -d hawkview_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # The HAW-70 suites verify genuine Git objects: they walk raw ancestry
          # to pinned commits, read the selected tree at those commits and hash
          # the blobs. A shallow clone cannot satisfy any of that. The ref that
          # actions/checkout resolves by default is deliberately NOT overridden,
          # so a pull_request still runs against its merge context and PR
          # integration testing is not replaced by head-only testing.
          fetch-depth: 0
          # Later steps run test code that spawns Git. It must not inherit the
          # checkout credential.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install root dependencies for cross-layer tests
        working-directory: .
        run: npm ci
      - run: npm ci
      # ---------------------------------------------------------------------
      # HAW-70 registration. These run after BOTH dependency installs and
      # BEFORE db:generate, db:validate, the migration deploy, the broad
      # application tests and the build, so a failure here is attributable to
      # the HAW-70 closure rather than to database or application state. They
      # add no database, migration CLI, provider or application execution.
      # ---------------------------------------------------------------------
      - name: Refuse real dotenv inputs before the HAW-70 TypeScript suites
        working-directory: .
        shell: bash
        run: |
          set -uo pipefail
          status=0
          # The dedicated config control observes a loader route under a
          # synthetic child environment. A real dotenv file or an ambient
          # DOTENV_CONFIG_* override would make that observation depend on
          # inputs this job does not control, so the job REFUSES rather than
          # deleting or ignoring them. Names only are reported; no value is
          # ever read or printed.
          for candidate in .env .env.local backend/.env backend/.env.local; do
            if [ -e "$candidate" ]; then
              echo "refusing: $candidate is present and must not be supplied to this job"
              status=1
            fi
          done
          for name in $(compgen -v | grep '^DOTENV_CONFIG_' || true); do
            echo "refusing: ambient $name is set"
            status=1
          done
          if [ "$status" -ne 0 ]; then
            echo 'The HAW-70 configuration control requires no real dotenv input.'
          fi
          exit "$status"
      - name: HAW-70 narrow consumer typecheck
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.haw70-scripts.json
      - name: HAW-70 TypeScript suites, serial and nonconnecting
        env:
          # Set at the step, so both are in place before Node starts and before
          # any loader initialises.
          JITI_FS_CACHE: 'false'
          TSX_DISABLE_CACHE: '1'
        run: >-
          node --import tsx --test --test-concurrency=1
          scripts/haw70-upgrade-target.test.ts
          scripts/haw70-upgrade-config.test.ts
          scripts/haw70-upgrade-launch-plan.test.ts
          scripts/haw70-upgrade-runner.test.ts
      - run: npm run db:generate
      - run: npm run db:validate
      # -------------------------------------------------------------------
      # HAW-70 STAGED UPGRADE, DEFAULT OFF.
      #
      # Reached ONLY by the exact conjunction of a workflow_dispatch event and
      # the explicit 'haw70-upgrade' choice. A pull request cannot reach it,
      # and neither can a default dispatch.
      #
      # It runs BEFORE any fresh migration, and the fresh migration and the
      # database application suite below are skipped when it runs. That is not
      # tidiness. The driver refuses a non-empty target, so a fresh deploy
      # first would make it refuse; and after its scoped cleanup it
      # deliberately retains the authority tombstones and the two fixture
      # organizations, which must never be presented to the ordinary suite as
      # a pristine database.
      #
      # The driver owns everything else: it materializes its own stage from
      # this checkout, derives its own stage handoff, qualifies the installed
      # Prisma before connecting, and performs all three deployment stages,
      # the history and fixture checks, the backfill and catalog checks, the
      # no-op redeploy and the scoped cleanup. Nothing here supplies a stage
      # root, a source SHA, a URL, a binary or a command.
      # -------------------------------------------------------------------
      - name: HAW-70 staged baseline-to-candidate upgrade, explicit dispatch only
        if: github.event_name == 'workflow_dispatch' && inputs.migration_profile == 'haw70-upgrade'
        shell: bash
        run: |
          set -uo pipefail
          # Resolve the setup-node executable BEFORE closing the environment,
          # because the closed environment deliberately carries no PATH to it.
          node_executable="$(command -v node)"
          test -x "$node_executable"
          echo "node executable:  $node_executable"
          echo "checked out HEAD: $(git -C .. rev-parse HEAD)"
          echo "checked out tree: $(git -C .. rev-parse HEAD^{tree})"
          # A CLOSED environment, constructed here and handed to Node before it
          # initialises. The hosted identity values are carried through EXACTLY
          # as GitHub reports them and are never substituted: the driver's
          # target guard requires GITHUB_SHA, GITHUB_WORKFLOW_SHA and the
          # actual checkout to agree, and a mismatch must fail rather than be
          # papered over. No stage handoff, NODE_OPTIONS, NODE_PATH, proxy,
          # PG*, dotenv, Git-routing or credential variable is passed.
          env -i \
            PATH=/usr/bin:/bin \
            CI="$CI" \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            RUNNER_OS="$RUNNER_OS" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_SERVER_URL="$GITHUB_SERVER_URL" \
            GITHUB_API_URL="$GITHUB_API_URL" \
            GITHUB_WORKFLOW="$GITHUB_WORKFLOW" \
            GITHUB_JOB="$GITHUB_JOB" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_REF_TYPE="$GITHUB_REF_TYPE" \
            GITHUB_REF="$GITHUB_REF" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
            HAWKVIEW_CI_MIGRATION_PROFILE=haw70-upgrade \
            HAWKVIEW_RUN_HAW70_UPGRADE=1 \
            HAWKVIEW_RUN_DATABASE_INTEGRATION_TESTS=1 \
            HAWKVIEW_CI_DISPOSABLE_POSTGRES=1 \
            HAWKVIEW_HAW70_TENANT_DELETE_WITNESS=1 \
            HAWKVIEW_HAW70_AUDIT_WRITER_WITNESS=1 \
            HAWKVIEW_HAW70_DELETE_LOCK_ORDER_WITNESS=1 \
            DATABASE_URL=postgresql://hawkview_ci:hawkview_ci@127.0.0.1:5432/hawkview_ci \
            TZ=UTC \
            JITI_FS_CACHE=false \
            TSX_DISABLE_CACHE=1 \
            LANG=C \
            LC_ALL=C \
            "$node_executable" --import tsx --input-type=module -e '
              const started = Date.now()
              const runner = await import("./scripts/haw70-upgrade-runner.ts")
              const limitMs = 1200000
              let timer = null
              const deadline = new Promise((resolve, reject) => {
                timer = setTimeout(() => reject(new Error("haw70-timeout")), limitMs)
              })
              let outcome = null
              try {
                outcome = await Promise.race([
                  runner.runHaw70StagedUpgrade({ environment: process.env }),
                  deadline,
                ])
              } catch (error) {
                if (timer !== null) clearTimeout(timer)
                const timedOut = error instanceof Error && error.message === "haw70-timeout"
                process.stdout.write(JSON.stringify({
                  haw70: "refused",
                  reason: timedOut ? "timeout" : "unexpected rejection",
                  elapsedMs: Date.now() - started,
                }) + "\n")
                process.exit(1)
              }
              if (timer !== null) clearTimeout(timer)
              process.stdout.write(JSON.stringify({
                haw70: "outcome",
                kind: outcome.kind,
                completed: outcome.completed,
                phase: outcome.phase,
                failure: outcome.failure,
                candidateCommit: outcome.candidateCommit,
                counts: outcome.counts,
                retained: outcome.retained,
                elapsedMs: Date.now() - started,
              }, null, 2) + "\n")
              process.exit(outcome.completed === true ? 0 : 1)
            '
      - name: Apply every committed migration
        if: >-
          !(github.event_name == 'workflow_dispatch'
          && inputs.migration_profile == 'haw70-upgrade')
        run: npm run db:migrate:deploy
      - name: Backend tests, including real PostgreSQL isolation
        if: >-
          !(github.event_name == 'workflow_dispatch'
          && inputs.migration_profile == 'haw70-upgrade')
        shell: bash
        run: |
          mapfile -t tests < <(find src -type f -name '*.test.ts' -print | sort)
          test "${#tests[@]}" -gt 0
          node --test ../.github/scripts/backend-quality-tests.test.mjs
          node ../.github/scripts/backend-quality-tests.mjs "${tests[@]}"
      - run: npm run build
      - name: Backend standalone script tests
        run: node --test scripts/*.test.mjs
      - name: Build production runtime image for cron smoke
        run: docker build --tag hawkview-cron-smoke:ci .
      - name: Network-isolated production cron entrypoint smoke
        env:
          HAWKVIEW_RUN_CRON_IMAGE_TESTS: '1'
          HAWKVIEW_CRON_TEST_IMAGE: hawkview-cron-smoke:ci
        run: node --test scripts/cron-runtime-image.test.mjs
